name: Continuous Integration

on: [push, pull_request]

jobs:
  lint:
    name: Code Quality (Linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Lint
        run: flake8 --config=backend/.flake8 backend/

  test:
    name: Backend Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy .env
        run: |
          echo "POSTGRES_DB=partstock_db" > .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "DATABASE_URL=postgres://postgres:postgres@db:5432/partstock_db" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env
          echo "DJANGO_SETTINGS_MODULE=config.settings" >> .env
          echo "SECRET_KEY=django-insecure-test-key-para-ci-cd-123" >> .env
          echo "DEBUG=True" >> .env

      - name: Build and Run Tests
        run: |
          docker compose up -d db redis
          docker compose run --rm test pytest partstock/tests/

      - name: Shutdown Environment
        if: always()
        run: |
          docker compose down -v
